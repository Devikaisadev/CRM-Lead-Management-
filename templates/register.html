{% extends "base.html" %}{% block title %}Create account · LeadFlow{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="logo-mark">$$$</div><h2>Create your account</h2><p class="muted">Start organizing your customer data.</p>
  <form method="post">
    <label class="form-label">Full name</label><input class="form-control mb-3" name="name" required>
    <label class="form-label">Email address</label><input class="form-control mb-3" type="email" name="email" required>
    <label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" minlength="8" required placeholder="At least 8 characters">
    <button class="btn btn-primary w-100 py-2">Create account</button>
  </form>
  <p class="text-center mt-4 mb-0 muted">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
</div>
{% endblock %}
